title_error = { fg = "#8da1c8" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#B2C5D9" },
  { mime = "**/{audio,video}/*", fg = "#a7d0ec" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8da1c8" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#61a7d6" },
  { url = "*/", fg = "#61a7d6" },
]

[pick]
