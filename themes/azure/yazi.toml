  { name = "Desktop", text = "", fg = "#61a7d6" },
  { name = "Documents", text = "", fg = "#61a7d6" },
  { name = "Downloads", text = "", fg = "#61a7d6" },
  { name = "Movies", text = "", fg = "#a7d0ec" },
  { name = "Music", text = "", fg = "#a7d0ec" },
  { name = "Pictures", text = "", fg = "#B2C5D9" },
  { name = "Videos", text = "", fg = "#a7d0ec" },
]
conds = [
  { if = "orphan", text = "", fg = "#eff3f8" },
  { if = "link", text = "", fg = "#596b85" },
  { if = "dummy", text = "", fg = "#8da1c8" },
