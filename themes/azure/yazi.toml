# generated by theme-pack from the active omacosy theme

[mgr]
cwd = { fg = "#61a7d6" }
find_keyword = { fg = "#a7d0ec", bold = true, italic = true }
find_position = { fg = "#61a7d6", bold = true }
marker_copied = { fg = "#a7d0ec", bg = "#a7d0ec" }
marker_cut = { fg = "#8da1c8", bg = "#8da1c8" }
marker_selected = { fg = "#B2C5D9", bg = "#B2C5D9" }
marker_symbol = "│"
border_style = { fg = "#61a7d6" }

[tabs]
active = { fg = "#182538", bg = "#61a7d6", bold = true }
inactive = { fg = "#596b85", bg = "#233951" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[indicator]
parent = { fg = "#eff3f8", bg = "#233951" }
current = { fg = "#182538", bg = "#61a7d6", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#182538", bg = "#61a7d6", bold = true }
normal_alt = { fg = "#61a7d6", bg = "#233951" }
select_main = { fg = "#182538", bg = "#a7d0ec", bold = true }
select_alt = { fg = "#a7d0ec", bg = "#233951" }
unset_main = { fg = "#182538", bg = "#8da1c8", bold = true }
unset_alt = { fg = "#8da1c8", bg = "#233951" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#61a7d6" }
perm_read = { fg = "#B2C5D9" }
perm_write = { fg = "#8da1c8" }
perm_exec = { fg = "#a7d0ec" }
progress_normal = { fg = "#61a7d6", bg = "#233951" }
progress_error = { fg = "#8da1c8", bg = "#233951" }

[which]
mask = { bg = "#182538" }
cand = { fg = "#61a7d6" }
rest = { fg = "#596b85" }
desc = { fg = "#a7d0ec" }
