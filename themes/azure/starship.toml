# generated by theme-pack from the active omacosy theme
format = """
[](fg:#8da1c8)\
$os\
$username\
[](fg:#8da1c8 bg:#61a7d6)\
$directory\
[](fg:#61a7d6 bg:#4f87ad)\
$git_branch\
$git_status\
[](fg:#4f87ad bg:#3c6784)\
$nodejs\
$python\
$rust\
$golang\
$ruby\
$php\
$java\
$bun\
[](fg:#3c6784 bg:#49586d)\
$docker_context\
$custom\
[](fg:#49586d)\
$line_break$character"""

add_newline = false

[os]
disabled = false
style = "bg:#8da1c8 fg:#182538"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:#8da1c8 fg:#182538 bold"
style_root = "bg:#8da1c8 fg:#182538 bold"
format = "[ $user ]($style)"

[directory]
style = "fg:#182538 bg:#61a7d6 bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#4f87ad"
format = '[[ $symbol $branch ](fg:#182538 bg:#4f87ad)]($style)'

[git_status]
style = "bg:#4f87ad"
format = '[[($all_status$ahead_behind )](fg:#182538 bg:#4f87ad)]($style)'

[nodejs]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[python]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[rust]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[golang]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[ruby]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[php]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[java]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[bun]
symbol = ""
style = "bg:#3c6784"
format = '[[ $symbol $version ](fg:#eff3f8 bg:#3c6784)]($style)'

[docker_context]
symbol = ""
style = "bg:#49586d"
format = '[[ $symbol $context ](fg:#eff3f8 bg:#49586d)]($style)'

[custom.shellmark]
when = "test \"${SHLVL:-1}\" -gt 2"
command = "printf Z"
style = "bg:#49586d fg:#eff3f8 bold"
format = "[ $output ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[>](fg:#eff3f8 bold)"
error_symbol = "[>](fg:#969293 bold)"
vimcmd_symbol = "[>](fg:#eff3f8 bold)"
vimcmd_replace_one_symbol = "[>](fg:#969293 bold)"
vimcmd_replace_symbol = "[>](fg:#969293 bold)"
vimcmd_visual_symbol = "[>](fg:#61a7d6 bold)"
