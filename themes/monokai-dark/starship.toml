# generated by theme-pack from the active omacosy theme
format = """$username$directory$git_branch$git_status$time$character"""

add_newline = false

[username]
show_always = true
style_user = "bg:#51b7d0 fg:#272822"
style_root = "bg:#51b7d0 fg:#272822"
format = "[ $user ]($style)"

[directory]
style = "bg:#97dae7 fg:#272822"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
style = "bg:#e6db74 fg:#272822"
format = "[ $branch ]($style)"

[git_status]
style = "bg:#e6db74 fg:#272822"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#75715e fg:#f8f8f2"
format = "[ $time ]($style) "

[character]
success_symbol = "[>](fg:#51b7d0 bold)"
error_symbol = "[>](fg:#f92672 bold)"
