# generated by theme-pack from the active omacosy theme
format = """
[](fg:#bd4924)\
$os\
$username\
[](fg:#bd4924 bg:#f9cc6c)\
$directory\
[](fg:#f9cc6c bg:#fd6883)\
$git_branch\
$git_status\
[](fg:#fd6883 bg:#df782d)\
$nodejs\
$python\
$rust\
$golang\
$ruby\
$php\
$java\
$bun\
[](fg:#df782d bg:#948a8b)\
$docker_context\
$custom\
[](fg:#948a8b)\
$line_break$character"""

add_newline = false

[os]
disabled = false
style = "bg:#bd4924 fg:#e7aa5a"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:#bd4924 fg:#e7aa5a bold"
style_root = "bg:#bd4924 fg:#e7aa5a bold"
format = "[ $user ]($style)"

[directory]
style = "fg:#1c0e00 bg:#f9cc6c bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#fd6883"
format = '[[ $symbol $branch ](fg:#1c0e00 bg:#fd6883)]($style)'

[git_status]
style = "bg:#fd6883"
format = '[[($all_status$ahead_behind )](fg:#1c0e00 bg:#fd6883)]($style)'

[nodejs]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[python]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[rust]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[golang]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[ruby]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[php]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[java]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[bun]
symbol = ""
style = "bg:#df782d"
format = '[[ $symbol $version ](fg:#1c0e00 bg:#df782d)]($style)'

[docker_context]
symbol = ""
style = "bg:#948a8b"
format = '[[ $symbol $context ](fg:#1c0e00 bg:#948a8b)]($style)'

[custom.shellmark]
when = "test \"${SHLVL:-1}\" -gt 2"
command = "printf Z"
style = "bg:#948a8b fg:#1c0e00 bold"
format = "[ $output ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[>](fg:#e7aa5a bold)"
error_symbol = "[>](fg:#fd6883 bold)"
vimcmd_symbol = "[>](fg:#e7aa5a bold)"
vimcmd_replace_one_symbol = "[>](fg:#fd6883 bold)"
vimcmd_replace_symbol = "[>](fg:#fd6883 bold)"
vimcmd_visual_symbol = "[>](fg:#f9cc6c bold)"
