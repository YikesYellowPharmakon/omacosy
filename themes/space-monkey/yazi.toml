# generated by theme-pack from the active omacosy theme

[mgr]
cwd = { fg = "#fd6883" }
find_keyword = { fg = "#df782d", bold = true, italic = true }
find_position = { fg = "#bd4924", bold = true }
marker_copied = { fg = "#df782d", bg = "#df782d" }
marker_cut = { fg = "#bd4924", bg = "#bd4924" }
marker_selected = { fg = "#f9cc6c", bg = "#f9cc6c" }
marker_symbol = "│"
border_style = { fg = "#bd4924" }

[tabs]
active = { fg = "#e7aa5a", bg = "#bd4924", bold = true }
inactive = { fg = "#7a7273", bg = "#351705" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[indicator]
parent = { fg = "#e7aa5a", bg = "#351705" }
current = { fg = "#e7aa5a", bg = "#bd4924", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#e7aa5a", bg = "#bd4924", bold = true }
normal_alt = { fg = "#bd4924", bg = "#351705" }
select_main = { fg = "#1c0e00", bg = "#df782d", bold = true }
select_alt = { fg = "#df782d", bg = "#351705" }
unset_main = { fg = "#e7aa5a", bg = "#bd4924", bold = true }
unset_alt = { fg = "#bd4924", bg = "#351705" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#fd6883" }
perm_read = { fg = "#f9cc6c" }
perm_write = { fg = "#bd4924" }
perm_exec = { fg = "#df782d" }
progress_normal = { fg = "#fd6883", bg = "#351705" }
progress_error = { fg = "#bd4924", bg = "#351705" }

[which]
mask = { bg = "#1c0e00" }
cand = { fg = "#fd6883" }
rest = { fg = "#7a7273" }
desc = { fg = "#df782d" }
separator_style = { fg = "#7a7273" }

[input]
border = { fg = "#bd4924" }
selected = { fg = "#e7aa5a", bg = "#bd4924" }

[cmp]
border = { fg = "#bd4924" }
active = { fg = "#e7aa5a", bg = "#bd4924", bold = true }

[notify]
title_info = { fg = "#fd6883" }
title_warn = { fg = "#f9cc6c" }
title_error = { fg = "#bd4924" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#f9cc6c" },
  { mime = "**/{audio,video}/*", fg = "#df782d" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bd4924" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#fd6883" },
  { url = "*/", fg = "#fd6883" },
]

[pick]
border = { fg = "#bd4924" }
active = { fg = "#df782d", bold = true }

[tasks]
border = { fg = "#bd4924" }
hovered = { fg = "#df782d", bold = true }

[spot]
border = { fg = "#bd4924" }
title = { fg = "#bd4924" }
tbl_col = { fg = "#fd6883" }
tbl_cell = { fg = "#df782d", bg = "#351705" }

[help]
border = { fg = "#bd4924" }
chord = { fg = "#fd6883" }
hovered = { reversed = true, bold = true }

[icon]
dirs = [
  { name = ".config", text = "", fg = "#df782d" },
  { name = ".git", text = "", fg = "#fd6883" },
  { name = ".github", text = "", fg = "#bd4924" },
  { name = "Desktop", text = "", fg = "#fd6883" },
  { name = "Documents", text = "", fg = "#fd6883" },
  { name = "Downloads", text = "", fg = "#fd6883" },
  { name = "Movies", text = "", fg = "#df782d" },
  { name = "Music", text = "", fg = "#df782d" },
  { name = "Pictures", text = "", fg = "#f9cc6c" },
  { name = "Videos", text = "", fg = "#df782d" },
]
conds = [
  { if = "orphan", text = "", fg = "#e7aa5a" },
  { if = "link", text = "", fg = "#7a7273" },
  { if = "dummy", text = "", fg = "#bd4924" },
  { if = "dir & hovered", text = "", fg = "#bd4924" },
  { if = "dir", text = "", fg = "#fd6883" },
  { if = "exec", text = "", fg = "#df782d" },
  { if = "!dir", text = "", fg = "#e7aa5a" },
]
