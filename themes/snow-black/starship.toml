# generated by theme-pack from the active omacosy theme
format = """$username$directory$git_branch$git_status$time$character"""

add_newline = false

[username]
show_always = true
style_user = "bg:#777777 fg:#FFFFFF"
style_root = "bg:#777777 fg:#FFFFFF"
format = "[ $user ]($style)"

[directory]
style = "bg:#b0b0b0 fg:#000000"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
style = "bg:#A06666 fg:#FFFFFF"
format = "[ $branch ]($style)"

[git_status]
style = "bg:#A06666 fg:#FFFFFF"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#333333 fg:#FFFFFF"
format = "[ $time ]($style) "

[character]
success_symbol = "[>](fg:#777777 bold)"
error_symbol = "[>](fg:#5F8787 bold)"
