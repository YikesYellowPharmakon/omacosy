# generated by theme-pack from the active omacosy theme
format = """
[](fg:#DD9999)\
$os\
$username\
[](fg:#DD9999 bg:#A06666)\
$directory\
[](fg:#A06666 bg:#5F8787)\
$git_branch\
$git_status\
[](fg:#5F8787 bg:#888888)\
$nodejs\
$python\
$rust\
$golang\
$ruby\
$php\
$java\
$bun\
[](fg:#888888 bg:#333333)\
$docker_context\
$custom\
[](fg:#333333)\
$line_break$character"""

add_newline = false

[os]
disabled = false
style = "bg:#DD9999 fg:#000000"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:#DD9999 fg:#000000 bold"
style_root = "bg:#DD9999 fg:#000000 bold"
format = "[ $user ]($style)"

[directory]
style = "fg:#FFFFFF bg:#A06666 bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#5F8787"
format = '[[ $symbol $branch ](fg:#000000 bg:#5F8787)]($style)'

[git_status]
style = "bg:#5F8787"
format = '[[($all_status$ahead_behind )](fg:#000000 bg:#5F8787)]($style)'

[nodejs]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[python]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[rust]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[golang]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[ruby]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[php]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[java]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[bun]
symbol = ""
style = "bg:#888888"
format = '[[ $symbol $version ](fg:#000000 bg:#888888)]($style)'

[docker_context]
symbol = ""
style = "bg:#333333"
format = '[[ $symbol $context ](fg:#FFFFFF bg:#333333)]($style)'

[custom.shellmark]
when = "test \"${SHLVL:-1}\" -gt 2"
command = "printf Z"
style = "bg:#333333 fg:#FFFFFF bold"
format = "[ $output ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[>](fg:#FFFFFF bold)"
error_symbol = "[>](fg:#5F8787 bold)"
vimcmd_symbol = "[>](fg:#FFFFFF bold)"
vimcmd_replace_one_symbol = "[>](fg:#5F8787 bold)"
vimcmd_replace_symbol = "[>](fg:#5F8787 bold)"
vimcmd_visual_symbol = "[>](fg:#A06666 bold)"
