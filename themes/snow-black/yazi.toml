# generated by theme-pack from the active omacosy theme

[mgr]
cwd = { fg = "#5F8787" }
find_keyword = { fg = "#DD9999", bold = true, italic = true }
find_position = { fg = "#A06666", bold = true }
marker_copied = { fg = "#DD9999", bg = "#DD9999" }
marker_cut = { fg = "#A06666", bg = "#A06666" }
marker_selected = { fg = "#C1C1C1", bg = "#C1C1C1" }
marker_symbol = "│"
border_style = { fg = "#A06666" }

[tabs]
active = { fg = "#FFFFFF", bg = "#A06666", bold = true }
inactive = { fg = "#7a7a7a", bg = "#191010" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[indicator]
parent = { fg = "#FFFFFF", bg = "#191010" }
current = { fg = "#FFFFFF", bg = "#A06666", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#FFFFFF", bg = "#A06666", bold = true }
normal_alt = { fg = "#A06666", bg = "#191010" }
select_main = { fg = "#000000", bg = "#DD9999", bold = true }
select_alt = { fg = "#DD9999", bg = "#191010" }
unset_main = { fg = "#FFFFFF", bg = "#A06666", bold = true }
unset_alt = { fg = "#A06666", bg = "#191010" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#5F8787" }
perm_read = { fg = "#C1C1C1" }
perm_write = { fg = "#A06666" }
perm_exec = { fg = "#DD9999" }
progress_normal = { fg = "#5F8787", bg = "#191010" }
progress_error = { fg = "#A06666", bg = "#191010" }

[which]
mask = { bg = "#000000" }
cand = { fg = "#5F8787" }
rest = { fg = "#7a7a7a" }
desc = { fg = "#DD9999" }
separator_style = { fg = "#7a7a7a" }

[input]
border = { fg = "#A06666" }
selected = { fg = "#FFFFFF", bg = "#A06666" }

[cmp]
border = { fg = "#A06666" }
active = { fg = "#FFFFFF", bg = "#A06666", bold = true }

[notify]
title_info = { fg = "#5F8787" }
title_warn = { fg = "#C1C1C1" }
title_error = { fg = "#A06666" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#C1C1C1" },
  { mime = "**/{audio,video}/*", fg = "#DD9999" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#A06666" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#5F8787" },
  { url = "*/", fg = "#5F8787" },
]

[pick]
border = { fg = "#A06666" }
active = { fg = "#DD9999", bold = true }

[tasks]
border = { fg = "#A06666" }
hovered = { fg = "#DD9999", bold = true }

[spot]
border = { fg = "#A06666" }
title = { fg = "#A06666" }
tbl_col = { fg = "#5F8787" }
tbl_cell = { fg = "#DD9999", bg = "#191010" }

[help]
border = { fg = "#A06666" }
chord = { fg = "#5F8787" }
hovered = { reversed = true, bold = true }

[icon]
dirs = [
  { name = ".config", text = "", fg = "#DD9999" },
  { name = ".git", text = "", fg = "#5F8787" },
  { name = ".github", text = "", fg = "#A06666" },
  { name = "Desktop", text = "", fg = "#5F8787" },
  { name = "Documents", text = "", fg = "#5F8787" },
  { name = "Downloads", text = "", fg = "#5F8787" },
  { name = "Movies", text = "", fg = "#DD9999" },
  { name = "Music", text = "", fg = "#DD9999" },
  { name = "Pictures", text = "", fg = "#C1C1C1" },
  { name = "Videos", text = "", fg = "#DD9999" },
]
conds = [
  { if = "orphan", text = "", fg = "#FFFFFF" },
  { if = "link", text = "", fg = "#7a7a7a" },
  { if = "dummy", text = "", fg = "#A06666" },
  { if = "dir & hovered", text = "", fg = "#A06666" },
  { if = "dir", text = "", fg = "#5F8787" },
  { if = "exec", text = "", fg = "#DD9999" },
  { if = "!dir", text = "", fg = "#FFFFFF" },
]
