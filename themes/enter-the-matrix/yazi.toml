# generated by theme-pack from the active omacosy theme

[mgr]
cwd = { fg = "#4CAF7E" }
find_keyword = { fg = "#A8BE5A", bold = true, italic = true }
find_position = { fg = "#7BAE4E", bold = true }
marker_copied = { fg = "#A8BE5A", bg = "#A8BE5A" }
marker_cut = { fg = "#7BAE4E", bg = "#7BAE4E" }
marker_selected = { fg = "#7CBCA0", bg = "#7CBCA0" }
marker_symbol = "│"
border_style = { fg = "#7BAE4E" }

[tabs]
active = { fg = "#131610", bg = "#7BAE4E", bold = true }
inactive = { fg = "#5e8557", bg = "#232e19" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[indicator]
parent = { fg = "#93B298", bg = "#232e19" }
current = { fg = "#131610", bg = "#7BAE4E", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#131610", bg = "#7BAE4E", bold = true }
normal_alt = { fg = "#7BAE4E", bg = "#232e19" }
select_main = { fg = "#131610", bg = "#A8BE5A", bold = true }
select_alt = { fg = "#A8BE5A", bg = "#232e19" }
unset_main = { fg = "#131610", bg = "#7BAE4E", bold = true }
unset_alt = { fg = "#7BAE4E", bg = "#232e19" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#4CAF7E" }
perm_read = { fg = "#7CBCA0" }
perm_write = { fg = "#7BAE4E" }
perm_exec = { fg = "#A8BE5A" }
progress_normal = { fg = "#4CAF7E", bg = "#232e19" }
progress_error = { fg = "#7BAE4E", bg = "#232e19" }

[which]
mask = { bg = "#131610" }
cand = { fg = "#4CAF7E" }
rest = { fg = "#5e8557" }
desc = { fg = "#A8BE5A" }
separator_style = { fg = "#5e8557" }

[input]
border = { fg = "#7BAE4E" }
selected = { fg = "#131610", bg = "#7BAE4E" }

[cmp]
border = { fg = "#7BAE4E" }
active = { fg = "#131610", bg = "#7BAE4E", bold = true }

[notify]
title_info = { fg = "#4CAF7E" }
title_warn = { fg = "#7CBCA0" }
title_error = { fg = "#7BAE4E" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#7CBCA0" },
  { mime = "**/{audio,video}/*", fg = "#A8BE5A" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#7BAE4E" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#4CAF7E" },
  { url = "*/", fg = "#4CAF7E" },
]

[pick]
border = { fg = "#7BAE4E" }
active = { fg = "#A8BE5A", bold = true }

[tasks]
border = { fg = "#7BAE4E" }
hovered = { fg = "#A8BE5A", bold = true }

[spot]
border = { fg = "#7BAE4E" }
title = { fg = "#7BAE4E" }
tbl_col = { fg = "#4CAF7E" }
tbl_cell = { fg = "#A8BE5A", bg = "#232e19" }

[help]
border = { fg = "#7BAE4E" }
chord = { fg = "#4CAF7E" }
hovered = { reversed = true, bold = true }

[icon]
dirs = [
  { name = ".config", text = "", fg = "#A8BE5A" },
  { name = ".git", text = "", fg = "#4CAF7E" },
  { name = ".github", text = "", fg = "#7BAE4E" },
  { name = "Desktop", text = "", fg = "#4CAF7E" },
  { name = "Documents", text = "", fg = "#4CAF7E" },
  { name = "Downloads", text = "", fg = "#4CAF7E" },
  { name = "Movies", text = "", fg = "#A8BE5A" },
  { name = "Music", text = "", fg = "#A8BE5A" },
  { name = "Pictures", text = "", fg = "#7CBCA0" },
  { name = "Videos", text = "", fg = "#A8BE5A" },
]
conds = [
  { if = "orphan", text = "", fg = "#93B298" },
  { if = "link", text = "", fg = "#5e8557" },
  { if = "dummy", text = "", fg = "#7BAE4E" },
  { if = "dir & hovered", text = "", fg = "#7BAE4E" },
  { if = "dir", text = "", fg = "#4CAF7E" },
  { if = "exec", text = "", fg = "#A8BE5A" },
  { if = "!dir", text = "", fg = "#93B298" },
]
