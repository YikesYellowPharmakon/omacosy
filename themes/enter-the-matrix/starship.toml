# generated by theme-pack from the active omacosy theme
format = """
[](fg:#7BAE4E)\
$os\
$username\
[](fg:#7BAE4E bg:#A8BE5A)\
$directory\
[](fg:#A8BE5A bg:#44b83a)\
$git_branch\
$git_status\
[](fg:#44b83a bg:#4a945e)\
$nodejs\
$python\
$rust\
$golang\
$ruby\
$php\
$java\
$bun\
[](fg:#4a945e bg:#33482F)\
$docker_context\
$custom\
[](fg:#33482F)\
$line_break$character"""

add_newline = false

[os]
disabled = false
style = "bg:#7BAE4E fg:#131610"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:#7BAE4E fg:#131610 bold"
style_root = "bg:#7BAE4E fg:#131610 bold"
format = "[ $user ]($style)"

[directory]
style = "fg:#131610 bg:#A8BE5A bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#44b83a"
format = '[[ $symbol $branch ](fg:#131610 bg:#44b83a)]($style)'

[git_status]
style = "bg:#44b83a"
format = '[[($all_status$ahead_behind )](fg:#131610 bg:#44b83a)]($style)'

[nodejs]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[python]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[rust]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[golang]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[ruby]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[php]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[java]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[bun]
symbol = ""
style = "bg:#4a945e"
format = '[[ $symbol $version ](fg:#131610 bg:#4a945e)]($style)'

[docker_context]
symbol = ""
style = "bg:#33482F"
format = '[[ $symbol $context ](fg:#93B298 bg:#33482F)]($style)'

[custom.shellmark]
when = "test \"${SHLVL:-1}\" -gt 2"
command = "printf Z"
style = "bg:#33482F fg:#93B298 bold"
format = "[ $output ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[>](fg:#93B298 bold)"
error_symbol = "[>](fg:#44b83a bold)"
vimcmd_symbol = "[>](fg:#93B298 bold)"
vimcmd_replace_one_symbol = "[>](fg:#44b83a bold)"
vimcmd_replace_symbol = "[>](fg:#44b83a bold)"
vimcmd_visual_symbol = "[>](fg:#A8BE5A bold)"
