# generated by theme-pack from the active omacosy theme
format = """$username$directory$git_branch$git_status$time$character"""

add_newline = false

[username]
show_always = true
style_user = "bg:#557c39 fg:#f5f5f5"
style_root = "bg:#557c39 fg:#f5f5f5"
format = "[ $user ]($style)"

[directory]
style = "bg:#588476 fg:#f5f5f5"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
style = "bg:#A8BE5A fg:#131610"
format = "[ $branch ]($style)"

[git_status]
style = "bg:#A8BE5A fg:#131610"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#33482F fg:#93B298"
format = "[ $time ]($style) "

[character]
success_symbol = "[>](fg:#557c39 bold)"
error_symbol = "[>](fg:#E5484D bold)"
