# omacosy-borders — ring styling. Reload: it re-reads on file change.
width=2
# Sequoia windows are tighter than the macOS 26 radii omacosy measured.
# 10pt hugs Finder / Safari / Chrome on 15.3; a 17pt ring floated off
# the corners and read as a second, clashing frame.
gap=0
radius=10
radius:Finder=10
radius:Safari=10
radius:Google Chrome=10
radius:Ghostty=8
radius:WhatsApp=12
