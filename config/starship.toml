# fallback; theme-set overwrites ~/.config/starship.toml
# generated by theme-pack from the active omacosy theme
format = """$username$directory$git_branch$git_status$time$character"""

add_newline = false

[username]
show_always = true
style_user = "bg:#8da1c8 fg:#182538"
style_root = "bg:#8da1c8 fg:#182538"
format = "[ $user ]($style)"

[directory]
style = "bg:#b2c0da fg:#182538"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
style = "bg:#6cabda fg:#182538"
format = "[ $branch ]($style)"

[git_status]
style = "bg:#6cabda fg:#182538"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#49586d fg:#eff3f8"
format = "[ $time ]($style) "

[character]
success_symbol = "[>](fg:#8da1c8 bold)"
error_symbol = "[>](fg:#969293 bold)"
